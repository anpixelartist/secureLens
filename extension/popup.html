<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntropyLens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0c0c18;
      color: #e2e8f0;
      padding: 0;
      overflow: hidden;
    }
    .header {
      padding: 16px 18px 12px;
      background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(6,182,212,0.06) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .header p {
      font-size: 10px;
      color: #475569;
      margin-top: 2px;
    }
    .meter-section {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meter-bar {
      height: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s ease;
      background: linear-gradient(90deg, #dc2626, #f59e0b, #06b6d4, #10b981, #8b5cf6);
    }
    .readout {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      transition: color 0.3s ease;
    }
    .readout span {
      font-size: 11px;
      font-weight: 400;
      color: #475569;
    }
    .settings {
      padding: 12px 18px 16px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .setting-row + .setting-row {
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .setting-label {
      font-size: 12px;
      color: #94a3b8;
    }
    .toggle {
      width: 36px;
      height: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .toggle.active { background: #10b981; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .toggle.active::after { transform: translateX(16px); }
    select {
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .status {
      padding: 10px 18px 14px;
      text-align: center;
      font-size: 10px;
      color: #334155;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .status.loaded { color: #10b981; }
    .status.loading { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>EntropyLens</h1>
    <p>Password strength analyzer</p>
  </div>

  <div class="meter-section">
    <div class="meter-labels">
      <span>Weak</span>
      <span>Moderate</span>
      <span>Strong</span>
      <span>Uncrackable</span>
    </div>
    <div class="meter-bar">
      <div class="meter-fill" id="meterFill"></div>
    </div>
    <div class="readout" id="entropyReadout">
      No password detected
    </div>
  </div>

  <div class="settings">
    <div class="setting-row">
      <span class="setting-label">Show overlay</span>
      <div class="toggle active" id="overlayToggle"></div>
    </div>
    <div class="setting-row">
      <span class="setting-label">Sensitivity</span>
      <select id="sensitivity">
        <option value="normal">Normal</option>
        <option value="strict">Strict</option>
      </select>
    </div>
  </div>

  <div class="status loading" id="modelStatus">Loading model...</div>

  <script src="popup.js"></script>
</body>
</html>
